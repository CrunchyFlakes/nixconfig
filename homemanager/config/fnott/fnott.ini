# -*- conf -*-

# For documentation on these options, see `man fnott.ini`

# Global values
output=Dell Inc. DELL U2725QE 7J97484
# min-width=0
# max-width=0
# max-height=0
# stacking-order=bottom-up
# anchor=top-right
# edge-margin-vertical=10
# edge-margin-horizontal=10
# notification-margin=10
# icon-theme=hicolor
# max-icon-size=32
# selection-helper=dmenu
# selection-helper-uses-null-separator=no
# play-sound=aplay ${filename}

# Default values, may be overridden in 'urgency' specific sections
# layer=top
background=282828ff

border-color=e78a4eff
border-radius=0
border-size=2

# padding-vertical=20
# padding-horizontal=20

# dpi-aware=no

title-font=SauceCodePro Nerd Font Mono:size=15
title-color=ddc7a1ff
title-format=<b>%a%A</b>

summary-font=SauceCodePro Nerd Font Mono:size=18
summary-color=d4be98ff
summary-format=<b>%s</b>

body-font=SauceCodePro Nerd Font Mono:size=13
body-color=d4be98ff
body-format=%b

# progress-bar-height=20
#progress-color=d8a657ff
# progress-style=bar

# sound-file=
# icon=

# Timeout values are in seconds. 0 to disable
# max-timeout=0
# default-timeout=0
# idle-timeout=0

